services:
  # 1. Backend Web Service (Django + DRF + Gunicorn + WhiteNoise)
  - type: web
    name: montessori-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn montessori_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: montessori-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Configurar opcionalmente en el dashboard de Render
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # 2. Frontend Web Service (React + Vite + TypeScript Static Site)
  - type: web
    name: montessori-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: montessori-backend
          property: host

databases:
  # 3. Base de Datos Gestionada PostgreSQL
  - name: montessori-postgres
    databaseName: montessori
    user: montessori_user
    plan: free
    region: oregon
